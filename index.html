<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReliaWay</title>
    <link rel="icon" href="images/icon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="main-header">
            <div class="header-bar">
                <img src="images/logo.png" alt="ReliaWay Logo" class="logo">
            </div>
            <h1>ReliaWay</h1>
            <p class="subtitle">اختر الخدمة التي ترغب في البدء بها</p>
            <div class="gold-line"></div>
        </header>

        <main class="steps-container">
            <div class="step-item">
                <a class="option-card step-card" href="booking.html">
                    <span class="step-number">1</span>
                    <h2>حجز لطالب</h2>
                    <p>  </p>
                </a>
            </div>

            <div class="step-divider" aria-hidden="true"></div>

            <div class="step-item">
                <a class="option-card step-card" href="pricing.html">
                    <span class="step-number">2</span>
                    <h2>الاستعلام عن خطط الاسعار و العقود</h2>
                    <p>استخدم هذه الصفحة للاستعلام عن خطط السداد وإنشاء العقد.</p>
                </a>
            </div>

            <div class="step-divider" aria-hidden="true"></div>

            <div class="step-item">
                <a class="option-card step-card" href="payment.html">
                    <span class="step-number">3</span>
                    <h2>الدفع و امضاء العقد</h2>
                    <p>سيتم إضافة خطوات الدفع والتوقيع هنا قريبًا.</p>
                </a>
            </div>
        </main>

        <footer class="page-footer" id="support">
            <p>نحن هنا لمساعدتك في إدارة خدماتك بسهولة وسرعة.</p>
            <div class="contact-buttons">
                <a class="contact-btn whatsapp" href="https://wa.me/201157722335" target="_blank" rel="noopener noreferrer">واتساب</a>
                <a class="contact-btn facebook" href="https://www.facebook.com/profile.php?id=61590549099190" target="_blank" rel="noopener noreferrer">فيسبوك</a>
            </div>
        </footer>
    </div>
</body>
</html>
